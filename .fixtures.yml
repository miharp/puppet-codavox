---
# No symlink for the module under test: rspec-puppet creates
# spec/fixtures/modules/codavox itself, taking the name from metadata.json.
# Declaring it here as well produced a broken link that rspec-puppet then
# refused to replace.
fixtures:
  forge_modules:
    stdlib:
      repo: puppetlabs/stdlib
      ref: 9.7.0
    inifile:
      repo: puppetlabs/inifile
      ref: 6.4.1
    # puppet_authorization edits auth.conf with the hocon gem, and pulls in
    # concat and hocon of its own.
    puppet_authorization:
      repo: puppetlabs/puppet_authorization
      ref: 1.0.1
    concat:
      repo: puppetlabs/concat
      ref: 10.0.1
    hocon:
      repo: puppetlabs/hocon
      ref: 2.0.0
    # yumrepo left Puppet core; openvox-agent bundles it, the test gem does not.
    yumrepo_core:
      repo: puppetlabs/yumrepo_core
      ref: 2.1.0
