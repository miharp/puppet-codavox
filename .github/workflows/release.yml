---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  gates:
    name: metadata.json matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare
        run: |
          # The Forge takes its version from metadata.json, so a tag that
          # disagrees would publish under the wrong number.
          tag="${GITHUB_REF_NAME#v}"
          recorded=$(ruby -rjson -e 'puts JSON.parse(File.read("metadata.json"))["version"]')
          echo "tag: $tag"
          echo "metadata.json: $recorded"
          if [ "$tag" != "$recorded" ]; then
            echo "::error::metadata.json says $recorded but this tag is $tag." \
                 "Bump metadata.json and re-tag."
            exit 1
          fi

  # The same job as miharp/puppet-headscale: build, push to the Forge, then
  # create the GitHub release with the tarball attached.
  release:
    name: Release
    needs: gates
    uses: voxpupuli/gha-puppet/.github/workflows/release.yml@v4
    with:
      allowed_owner: 'miharp'
    secrets:
      # Configure secrets here:
      #  https://docs.github.com/en/actions/security-guides/encrypted-secrets
      username: ${{ secrets.PUPPET_FORGE_USERNAME }}
      api_key: ${{ secrets.PUPPET_FORGE_API_KEY }}
